; PlatformIO Project Configuration for ESP32-C3 Super Mini
; Project: "TARS" Monolithic Tactical AI Assistant (Interstellar Edition)

[env:esp32-c3-devkitm-1]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Partition table: 1.9MB app partition (prevents 'program size greater than maximum allowed' error)
board_build.partitions = min_spiffs.csv

; Flash mode: DIO is required for ESP32-C3 Super Mini modules to avoid flash bootloops
board_build.flash_mode = dio

; Native USB CDC logging for ESP32-C3 Super Mini
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    olikraus/U8g2 @ ^2.34.22
    bblanchon/ArduinoJson @ ^7.0.4